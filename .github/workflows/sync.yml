name: Sync Upstream
on:
  schedule:
    - cron: "0 * * * *" # Runs hourly
  workflow_dispatch: # Allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Merge Upstream
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/pixincreate/PixeneOS.git
          git fetch upstream

          # Try to merge.
          if ! git merge upstream/main --allow-unrelated-histories --no-edit -m "Auto-sync"; then
            # This fork does not use upstream's Renovate setup. Deleting the files
            # also settles modify/delete conflicts on them.
            git rm -q -f --ignore-unmatch \
              .github/workflows/renovate.yml renovate.json5 .github/renovate.json5

            # Any other conflict needs a human. Never commit conflict markers:
            # fail the run and leave main untouched instead.
            unresolved=$(git diff --name-only --diff-filter=U)
            if [ -n "${unresolved}" ]; then
              echo "::error::Upstream sync has unresolved conflicts, resolve them manually:"
              echo "${unresolved}"
              git merge --abort
              exit 1
            fi

            git commit --no-edit -m "Auto-resolve renovate conflict by removing upstream renovate files"
          fi

          git push origin main
